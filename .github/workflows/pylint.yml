name: Python lint

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run_pylint:
    name: Run pylint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pylint
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Lint Python sources (allow import errors; do not fail build yet)
        shell: bash
        run: |
          set -e
          FILES=$(git ls-files '*.py' 'mailheadercheck' || true)
          if [ -n "$FILES" ]; then
            echo "Running pylint on:"
            echo "$FILES" | tr '\n' ' '
            # Disable import-error to avoid requiring C deps in the lint job, and avoid failing the workflow for now
            pylint --disable=import-error --fail-under=0 $FILES || true
          else
            echo "No Python files found to lint."
          fi
