services:
  mailheadercheck:
    build:
      context: .

    container_name: mailheadercheck

    # Healthcheck: verifies the TCP listener is up inside the container
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket,sys; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1',30073)); s.close(); sys.exit(0)"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s

    image: localhost/mailheadercheck

    # Publish the milter TCP port to the host.
    # Make sure the mounted config binds to 0.0.0.0 (see docker/config.yaml)
    ports:
      - "30073:30073"

    restart: always

    # Mount a container-specific config. You can copy/adjust it.
    volumes:
      - ./docker/config.yaml:/config/config.yaml:ro

